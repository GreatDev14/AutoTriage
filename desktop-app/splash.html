<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AutoTriage</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }

  .card {
    width: 390px;
    height: 520px;
    background: linear-gradient(160deg, #0f0f14 0%, #13131c 60%, #0a0a10 100%);
    border-radius: 32px;
    border: 1px solid rgba(249, 115, 22, 0.18);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    box-shadow:
      0 40px 90px rgba(0,0,0,0.95),
      0 0 0 1px rgba(255,255,255,0.03) inset,
      0 0 80px rgba(249,115,22,0.06);
    animation: cardIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    opacity: 0;
    transform: translateY(30px) scale(0.95);
  }

  /* Background grid */
  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(249,115,22,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(249,115,22,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    border-radius: 32px;
  }

  /* Top radial glow */
  .card::after {
    content: '';
    position: absolute;
    top: -60px; left: 50%;
    transform: translateX(-50%);
    width: 320px; height: 220px;
    background: radial-gradient(ellipse at center, rgba(249,115,22,0.18) 0%, transparent 70%);
    pointer-events: none;
  }

  /* Orbital rings */
  .rings {
    position: relative;
    width: 180px; height: 180px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 32px;
    z-index: 1;
  }

  .ring {
    position: absolute;
    border-radius: 50%;
    border: 1px solid rgba(249,115,22,0.12);
    animation: ringBreath 4s ease-in-out infinite;
  }
  .ring:nth-child(1) { width: 180px; height: 180px; animation-delay: 0s; }
  .ring:nth-child(2) { width: 140px; height: 140px; animation-delay: 0.5s; border-color: rgba(249,115,22,0.2); }
  .ring:nth-child(3) { width: 100px; height: 100px; animation-delay: 1s; border-color: rgba(249,115,22,0.3); }

  /* Rotating spinner arc */
  .ring-arc {
    position: absolute;
    width: 186px; height: 186px;
    border-radius: 50%;
    border: 2px solid transparent;
    border-top-color: rgba(249,115,22,0.7);
    border-right-color: rgba(249,115,22,0.25);
    animation: spin 2.2s linear infinite;
    z-index: 2;
  }

  .icon-box {
    width: 80px; height: 80px;
    border-radius: 22px;
    background: linear-gradient(145deg, #f97316, #c2410c);
    display: flex; align-items: center; justify-content: center;
    box-shadow:
      0 0 0 1px rgba(249,115,22,0.4),
      0 0 40px rgba(249,115,22,0.5),
      0 16px 40px rgba(0,0,0,0.5);
    z-index: 3;
    animation: iconIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s both;
  }

  .icon-box svg { width: 44px; height: 44px; }

  .brand {
    z-index: 1;
    text-align: center;
    margin-bottom: 28px;
    animation: fadeUp 0.5s ease 0.5s both;
  }

  .brand-name {
    font-size: 42px;
    font-weight: 900;
    letter-spacing: 8px;
    text-transform: uppercase;
    color: #ffffff;
    line-height: 1;
  }

  .brand-name .highlight { color: #f97316; }

  .brand-tag {
    font-size: 9px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.3);
    margin-top: 8px;
  }

  /* Progress bar */
  .progress-wrap {
    z-index: 1;
    width: 220px;
    height: 2px;
    background: rgba(249,115,22,0.1);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 14px;
    animation: fadeUp 0.5s ease 0.6s both;
  }

  .progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #f97316, #fbbf24);
    border-radius: 2px;
    box-shadow: 0 0 8px rgba(249,115,22,0.7);
    animation: fillBar 3.2s cubic-bezier(0.4, 0, 0.2, 1) 0.8s forwards;
  }

  .status-text {
    z-index: 1;
    font-size: 9px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.22);
    height: 14px;
    animation: fadeUp 0.5s ease 0.7s both;
    transition: opacity 0.4s ease;
  }

  .version {
    position: absolute;
    bottom: 20px;
    font-size: 8px;
    letter-spacing: 2px;
    color: rgba(255,255,255,0.08);
    z-index: 1;
  }

  @keyframes cardIn {
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes iconIn {
    from { opacity: 0; transform: scale(0.4) rotate(-15deg); }
    to { opacity: 1; transform: scale(1) rotate(0); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes ringBreath {
    0%, 100% { transform: scale(1); opacity: 0.6; }
    50% { transform: scale(1.04); opacity: 1; }
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  @keyframes fillBar {
    0%   { width: 0%; }
    30%  { width: 35%; }
    60%  { width: 68%; }
    82%  { width: 86%; }
    100% { width: 100%; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="rings">
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="ring-arc"></div>
      <div class="icon-box">
        <svg viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M6 30h32M8 30l3.5-10h21L36 30M13 20l2.5-6h13L31 20" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="13" cy="33" r="3" fill="white"/>
          <circle cx="31" cy="33" r="3" fill="white"/>
          <path d="M30 11c2.2 0 4 1.8 4 4s-1.8 4-4 4c-.5 0-1-.1-1.4-.3l-5.3 5.3-1.4-1.4 5.3-5.3c-.2-.4-.2-.9-.2-1.3 0-2.2 1.8-4 4-4z" fill="rgba(255,255,255,0.4)"/>
          <path d="M28 13l4 4" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>
    </div>

    <div class="brand">
      <div class="brand-name">AUTO<span class="highlight">TRIAGE</span></div>
      <div class="brand-tag">AI Vehicle Intelligence Platform</div>
    </div>

    <div class="progress-wrap">
      <div class="progress-bar"></div>
    </div>
    <div class="status-text" id="statusTxt">Initializing systems</div>

    <div class="version">v1.0.0 · AutoTriage Engine</div>
  </div>

  <script>
    const msgs = [
      'Initializing systems',
      'Loading AI modules',
      'Connecting dispatch engine',
      'Fetching provider APIs',
      'Syncing telemetry feeds',
      'Ready to dispatch'
    ];
    let idx = 0;
    const el = document.getElementById('statusTxt');
    setTimeout(() => {
      const iv = setInterval(() => {
        idx++;
        if (idx >= msgs.length) { clearInterval(iv); return; }
        el.style.opacity = '0';
        setTimeout(() => { el.textContent = msgs[idx]; el.style.opacity = '1'; }, 400);
      }, 520);
    }, 900);
  </script>
</body>
</html>
