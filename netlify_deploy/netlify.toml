[[redirects]]
  from = "/mechanics"
  to = "/mechanics.html"
  status = 200

[build]
  publish = "netlify_deploy"
  functions = "netlify_deploy/netlify/functions"

[[redirects]]
  from = "/api/send-email"
  to = "/.netlify/functions/send-email"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
