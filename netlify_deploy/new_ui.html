<div class="em-top" style="padding: 40px 24px 20px;">
      <!-- Glowing Heartbeat/SOS Icon -->
      <div style="display: flex; justify-content: center; align-items: center; margin-bottom: 24px; position: relative;">
        <div style="position: absolute; width: 80px; height: 80px; border-radius: 50%; background: rgba(230,57,70,0.15); filter: blur(15px); animation: pulse 1s infinite;"></div>
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#E63946" stroke-width="1.5" style="z-index: 2; filter: drop-shadow(0 0 8px rgba(230,57,70,0.6));">
          <path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>
        </svg>
      </div>
      <div style="font-family: 'Bebas Neue', sans-serif; font-size: 36px; color: white; letter-spacing: 2px;">EMERGENCY</div>
      <p style="font-family: 'Space Mono', monospace; font-size: 11px; color: rgba(255,255,255,0.5); margin-top: 8px;">24/7 IMMEDIATE ASSISTANCE NETWORK</p>
    </div>

    <!-- LIVE COORDINATES PANEL -->
    <div style="padding: 0 24px 20px;">
      <div style="background: rgba(20,20,22,0.8); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 16px; display: flex; align-items: center; justify-content: space-between;">
        <div>
          <div style="font-family: 'Space Mono', monospace; font-size: 10px; color: #00d084; font-weight: bold; margin-bottom: 4px;">LIVE GPS COORDINATES</div>
          <div id="emLiveCoords" style="font-family: 'Bebas Neue', sans-serif; font-size: 20px; color: white; letter-spacing: 1px;">LOCATING...</div>
        </div>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#00d084" stroke-width="1.5"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
      </div>
    </div>

    <!-- PANIC ALARM BUTTON -->
    <div style="padding: 0 24px 30px;">
      <button id="panicAlarmBtn" onclick="togglePanicAlarm()" style="background: linear-gradient(135deg, #E63946, #800000); box-shadow: 0 10px 30px rgba(230,57,70,0.6); color: white; border: 2px solid #ff4d4d; padding: 24px; border-radius: 20px; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; transition: all 0.2s; cursor: pointer;">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
        <span style="font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 2px;">SOUND PANIC ALARM</span>
      </button>
    </div>

    <!-- MAIN SOS SLIDER -->
    <div class="slide-sos-container" id="sosSlider">
      <div class="slide-track-fill" id="sosTrack"></div>
      <div class="slide-text">Slide to call 112</div>
      <div class="slide-handle" id="sosHandle"></div>
    </div>

    <div style="padding: 0 24px; margin-bottom: 30px; display: flex; flex-direction: column; gap: 12px;">
       <button class="action-btn red-btn" onclick="broadcastLocation()" style="box-shadow: 0 8px 25px rgba(230,57,70,0.3); border-radius: 12px; font-family: 'Space Mono', monospace; font-size: 11px; font-weight: bold;"> SHARE LIVE LOCATION VIA SMS</button>
       <button class="action-btn" onclick="goTo('checklist')" style="background:var(--mid); border:1px solid var(--border); color:var(--red); font-size:12px; font-family: 'Space Mono', monospace; box-shadow:none; border-radius: 12px;"> View Breakdown Checklist</button>
    </div>

    <!-- 2x2 EMERGENCY CONTACTS GRID -->
    <div style="padding: 0 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
      <a href="tel:911" style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 16px; text-decoration: none; display: flex; flex-direction: column; align-items: center; text-align: center;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#4da6ff" stroke-width="1.5" style="margin-bottom: 8px;"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
        <span style="color: rgba(255,255,255,0.5); font-family: 'Space Mono', monospace; font-size: 9px; margin-bottom: 4px;">POLICE</span>
        <span style="color: white; font-family: 'Bebas Neue', sans-serif; font-size: 24px; letter-spacing: 1px;">911</span>
      </a>
      <a href="tel:112" style="background: rgba(230,57,70,0.1); border: 1px solid rgba(230,57,70,0.3); border-radius: 16px; padding: 16px; text-decoration: none; display: flex; flex-direction: column; align-items: center; text-align: center;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#E63946" stroke-width="1.5" style="margin-bottom: 8px;"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg>
        <span style="color: rgba(255,255,255,0.5); font-family: 'Space Mono', monospace; font-size: 9px; margin-bottom: 4px;">MEDICAL / RESCUE</span>
        <span style="color: white; font-family: 'Bebas Neue', sans-serif; font-size: 24px; letter-spacing: 1px;">112</span>
      </a>
      <a href="tel:" style="background: rgba(255,136,0,0.1); border: 1px solid rgba(255,136,0,0.3); border-radius: 16px; padding: 16px; text-decoration: none; display: flex; flex-direction: column; align-items: center; text-align: center;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ff8800" stroke-width="1.5" style="margin-bottom: 8px;"><path d="M12 2v20"></path><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
        <span style="color: rgba(255,255,255,0.5); font-family: 'Space Mono', monospace; font-size: 9px; margin-bottom: 4px;">TOW TRUCK</span>
        <span style="color: white; font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 1px;">DISPATCH</span>
      </a>
      <a href="tel:911" style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 16px; text-decoration: none; display: flex; flex-direction: column; align-items: center; text-align: center;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#eab308" stroke-width="1.5" style="margin-bottom: 8px;"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"></path></svg>
        <span style="color: rgba(255,255,255,0.5); font-family: 'Space Mono', monospace; font-size: 9px; margin-bottom: 4px;">FIRE DEPT</span>
        <span style="color: white; font-family: 'Bebas Neue', sans-serif; font-size: 24px; letter-spacing: 1px;">911</span>
      </a>
    </div>
